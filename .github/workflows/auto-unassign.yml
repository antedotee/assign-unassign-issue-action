name: Auto-unassign Issues

on:
    schedule:
        # Run daily at 00:00 UTC
        - cron: "0 0 * * *"
        # For testing with fractional days (e.g., 0.01 days = 14.4 min), run every 5 minutes
        # Uncomment the line below for testing:
        # - cron: "*/5 * * * *"
    workflow_dispatch: # Allow manual triggering
        inputs:
            auto-unassign-days:
                description: "Number of days before auto-unassignment (supports fractional, e.g., 0.01 for ~14 min)"
                required: false
                default: "7"
            enable-reminder-messages:
                description: "Enable reminder messages"
                required: false
                default: false
                type: boolean

jobs:
    auto-unassign:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Auto-unassign expired issues
              uses: ./
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  auto-unassign-days: ${{ inputs.auto-unassign-days || '7' }}
                  unassigned-label: "unassigned"
                  enable-reminder-messages: ${{ inputs.enable-reminder-messages && 'true' || 'false' }}
                  reminder-message-template: "{days}/{totalDays} days remaining"
